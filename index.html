<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandip AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #00eaff;
    font-size: 40px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
}

#chat {
    height: 500px;
    overflow-y: auto;
    background: #222;
    border-radius: 20px;
    padding: 15px;
}

.message {
    padding: 13px;
    margin: 10px 0;
    border-radius: 15px;
    font-size: 18px;
    line-height: 1.5;
    word-wrap: break-word;
}

.ai {
    background: #333;
}

.user {
    background: #00695c;
    text-align: right;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 15px;
    font-size: 18px;
    outline: none;
}

button {
    border: none;
    border-radius: 15px;
    padding: 15px 18px;
    background: #00aaff;
    color: white;
    font-size: 17px;
}

#mic {
    background: #673ab7;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 Sandip AI</h1>

<div class="subtitle">
আমার নিজের AI Assistant
</div>

<div id="chat">

<div class="message ai">
🤖 নমস্কার! আমি Sandip AI।<br>
আমার সাথে কথা বলো।
</div>

</div>

<div class="input-area">

<input
id="message"
type="text"
placeholder="এখানে লিখুন..."
onkeydown="if(event.key==='Enter') sendMessage()"
>

<button onclick="sendMessage()">Send</button>

<button id="mic" onclick="startVoice()">🎤</button>

</div>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) return;

    chat.innerHTML += `
        <div class="message user">
            👤 ${escapeHtml(message)}
        </div>
    `;

    input.value = "";

    const thinking = document.createElement("div");

    thinking.className = "message ai";

    thinking.innerHTML = "🤖 ভাবছি...";

    chat.appendChild(thinking);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch(
            "https://sandip-ai.onrender.com/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        thinking.innerHTML =
            "🤖 " + escapeHtml(data.reply);

        speak(data.reply);

    } catch (error) {

        console.error(error);

        thinking.innerHTML =
            "❌ Server connection হচ্ছে না।";
    }

    chat.scrollTop = chat.scrollHeight;
}


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice recognition এই browser-এ support করছে না।"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "bn-IN";

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        document.getElementById("message").value =
            text;

        sendMessage();
    };

    recognition.onerror = function(event) {

        console.log(
            "Voice error:",
            event.error
        );
    };
}


function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "bn-IN";

    speech.rate = 0.95;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
